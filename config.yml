baseURL: "https://tuanmp.github.io/" 
title: Tuan Pham's homepage
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
    main:
        - name: Papers
          url: papers/
          weight: 2
        - name: Talks
          url: talks/
          weight: 3
        - name: About
          url: about/
          weight: 4

params:
    description: "Postdoctoral researcher at IJCLab (CNRS/Université Paris-Saclay). I develop machine-learning and generative-AI methods for high-energy physics, including graph neural networks for track reconstruction and fast detector simulation."
    author: Minh-Tuan Pham
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: false
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["books","courses","papers","data"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Minh-Tuan Pham
          subtitle: "I am a postdoctoral researcher at the Irène Joliot-Curie Laboratory (IJCLab), Université Paris-Saclay, working on scientific machine learning for particle physics. My research spans graph neural networks for charged-particle track reconstruction in the ATLAS Inner Tracker, and generative models (normalizing flows, diffusion) for fast detector simulation. I completed my PhD at the University of Wisconsin–Madison and was previously a doctoral researcher at CERN."
          imageUrl: "profile-pic.jpg"
          imageWidth: 220
          imageHeight: 220
          buttons:
            - name: Papers
              url: papers/
            - name: Talks
              url: talks/

    socialIcons:
        # CVs temporarily hidden while being finalized
        - name: Email
          url: mailto:pmtuan@proton.me
        - name: Google Scholar
          url: https://scholar.google.com/citations?hl=en&user=dIkMruUAAAAJ&view_op=list_works&sortby=pubdate
        - name: GitHub
          url: https://github.com/tuanmp
        - name: LinkedIn
          url: https://www.linkedin.com/in/tuan-pham-phd-87624797/

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Minh-Tuan Pham"
      # icon: image.png
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
